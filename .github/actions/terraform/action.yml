name: terraform
description: Authenticate to GCP with Workload Identity Federation, install Terraform and initialize the catalog.

inputs:
  state-prefix:
    description: The object prefix of the state in the GCS bucket.
    required: true
  workload-identity-provider:
    required: true
  service-account:
    required: true
  terraform-version:
    required: false
    default: "1.17.0"

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      working-directory: catalog
      env:
        STATE_PREFIX: ${{ inputs.state-prefix }}
      run: terraform init -input=false -backend-config="prefix=${STATE_PREFIX}"
